# cargo-deny configuration. Keep this file as the single source of
# truth for supply-chain policy; CI runs `cargo deny check` on every
# PR.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Only permissive licenses compatible with the project's
# `MIT OR Apache-2.0` distribution. Adding a license here is a
# review-required change.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "0BSD",
    "CC0-1.0",
]
confidence-threshold = 0.9
# libfuzzer-sys vendors the LLVM libFuzzer sources, which carry NCSA on top of
# its own MIT OR Apache-2.0. It is a fuzz-only build dependency and never
# reaches a published artifact.
exceptions = [{ name = "libfuzzer-sys", allow = ["NCSA"] }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A path dependency carries no version requirement; the wildcard ban is aimed
# at registry crates.
allow-wildcard-paths = true
highlight = "all"
allow = []
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
