[package]
name = "examples"
version = "0.0.0"
description = "Programs that read and write ISO base media files with isobmff and isobmff-mux"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[dev-dependencies]
# `dump_boxes` reads the compressed boxes back into the boxes they replace.
isobmff = { workspace = true, features = ["compressed-boxes"] }
# Every example but `dump_boxes` and `split_fragments` reads files with the
# demuxer; `remux` and `fast_start` write them with the muxer and fast start.
isobmff-mux = { workspace = true, features = ["compressed-boxes"] }
# Fetches the movie file `demux_stream` reads as its bytes arrive. Its TLS
# verifies certificates against the roots of the operating system, so that no
# bundled root store joins the graph.
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }
ureq = { version = "3.5.0", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }

[[example]]
name = "demux"
path = "demux.rs"

[[example]]
name = "demux_stream"
path = "demux_stream.rs"

[[example]]
name = "dump_boxes"
path = "dump_boxes.rs"

[[example]]
name = "fast_start"
path = "fast_start.rs"

[[example]]
name = "presentation_times"
path = "presentation_times.rs"

[[example]]
name = "remux"
path = "remux.rs"

[[example]]
name = "reserved_moov"
path = "reserved_moov.rs"

[[example]]
name = "split_fragments"
path = "split_fragments.rs"

[lints]
workspace = true
