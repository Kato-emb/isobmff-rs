[package]
name = "examples"
version = "0.0.0"
description = "Programs that read and write ISO base media files with isobmff, through its demuxer and muxers or through its layers alone"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dev-dependencies]
isobmff = { path = "../crates/isobmff" }
# Reads the conformance files, and runs ffprobe on what the examples write.
isobmff-test-support.workspace = true

[[example]]
name = "demux"
path = "demux.rs"
test = true

[[example]]
name = "remux"
path = "remux.rs"
test = true

[[example]]
name = "hybrid"
path = "hybrid.rs"
test = true

[lints]
workspace = true
