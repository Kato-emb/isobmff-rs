name: PR title

# `edited` re-validates on title edits, which fire no new commit.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Explicit list rather than the action's default, so the accepted
          # set cannot drift when the action updates.
          types: |
            feat
            fix
            refactor
            perf
            docs
            style
            test
            build
            ci
            chore
            revert
          # A trailing period would be baked into the squash commit and,
          # later, the generated CHANGELOG.
          subjectPattern: '^.*[^.]$'
          subjectPatternError: 'The subject "{subject}" must not end with a period.'
