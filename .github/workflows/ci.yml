name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; no job here needs more than read.
permissions:
  contents: read

# Cancel superseded PR runs, but never cancel a completed-per-commit run on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Minimum supported Rust version. Keep in sync with `rust-version` in Cargo.toml.
  MSRV: "1.86"
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # The alloc feature is on by default, so the run above never reaches the
      # alloc-free path. The no-std job does, but it cannot pass --all-targets —
      # a test binary needs std — so nothing else builds the tests and lints of
      # the very configuration the feature exists for.
      - run: cargo clippy -p isobmff-core --no-default-features --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - run: cargo nextest run --workspace --all-features --no-tests=pass
      - run: cargo test --doc --workspace --all-features

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features

  # This target ships no std, so std creeping back in — a dropped `#![no_std]`, a
  # dependency that needs std — fails here and nowhere else: the host jobs link
  # std for their test binaries no matter what the crate declares. A target that
  # does have std (wasm32-unknown-unknown) would add no such guard.
  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      # Not --all-targets: the test and doctest targets need std by design, and
      # building them here would fail for reasons unrelated to the crate.
      - run: cargo check --workspace --target thumbv7em-none-eabihf
      # The alloc feature is on by default, so every other job builds core with a
      # heap behind it. Only this run reaches the alloc-free path, and it runs on
      # the target that has no allocator to fall back on.
      - run: cargo check -p isobmff-core --no-default-features --target thumbv7em-none-eabihf

  nightly:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  # Fixed-run fuzzing over the committed corpus. A finding is a real bug, so this
  # job blocks the merge; the nightly it needs stays pinned to this job.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-04
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      # The target is spelled out because cargo-fuzz defaults to the triple it
      # was itself built for, and the binary this action installs is the
      # statically linked musl one.
      - run: cargo fuzz run boxes --target x86_64-unknown-linux-gnu -- -runs=65536
      - run: cargo fuzz run reader --target x86_64-unknown-linux-gnu -- -runs=65536
      - run: cargo fuzz run round_trip --target x86_64-unknown-linux-gnu -- -runs=65536

  docs:
    runs-on: ubuntu-latest
    env:
      # Mirror docs.rs, which builds with `--cfg docsrs`, so docsrs-gated doc items are checked here too.
      RUSTDOCFLAGS: "-D warnings --cfg docsrs"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@master

  # Check dependencies for advisories, license policy, banned crates, and sources.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      # The fuzz crate declares its own workspace, so the check above stops at
      # isobmff-core and never sees libfuzzer-sys or what it pulls in.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          manifest-path: fuzz/Cargo.toml
          arguments: --all-features --config deny.toml

  # A TODO/FIXME must carry an issue link or owner: `TODO(#12):`, `TODO(name):`, or a URL.
  bare-todo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Forbid bare TODO/FIXME markers
        run: |
          ! grep -rnE '//.*\b(TODO|FIXME)\b' --include='*.rs' . \
            | grep -vE '(TODO|FIXME)\([^)]+\)|#[0-9]+|https?://'
