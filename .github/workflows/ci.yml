name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; no job here needs more than read.
permissions:
  contents: read

# Cancel superseded PR runs, but never cancel a completed-per-commit run on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# Every rust-cache step saves only on main: a cache saved on a PR branch is
# invisible to other PRs and would only evict main's.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --check
      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
      # A TODO/FIXME must carry an issue link or owner: `TODO(#12):`, `TODO(name):`, or a URL.
      - name: Forbid bare TODO/FIXME markers
        run: |
          ! grep -rnE '//.*\b(TODO|FIXME)\b' --include='*.rs' . \
            | grep -vE '(TODO|FIXME)\([^)]+\)|#[0-9]+|https?://'

  # Every feature combination, so a path that only a non-default set of
  # features compiles is linted as well, the alloc-free one among them.
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-hack
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo hack clippy --workspace --feature-powerset --all-targets -- -D warnings
      # The fuzz targets are a workspace of their own, which the run above never
      # reaches. They build on stable; only running them needs a nightly.
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings

  # The tests run instrumented, so one run both gates and measures. Coverage is
  # reported, never gated on: a threshold rewards tests that execute lines
  # without stating any behavior.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: nextest,cargo-llvm-cov
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo llvm-cov nextest --no-report --workspace --all-features --no-tests=pass
      # The report informs and never gates, so it cannot fail the job either; it
      # has nothing to report while no code is covered, as in a crate with no
      # items.
      - continue-on-error: true
        run: |
          {
            echo '## Coverage'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # A pure Sans-IO library behaves the same on every host, so a pull request
  # runs the tests on Linux only (the coverage job); main proves macOS and
  # Windows on every merge.
  test:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: nextest
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo nextest run --workspace --all-features --no-tests=pass

  # The MSRV is read from Cargo.toml, so it is stated once and this job cannot
  # drift from it.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --all-targets --all-features

  # The host jobs link std for their test binaries whatever a crate declares, so
  # std creeping into a library crate — a dropped `#![no_std]`, a dependency that
  # needs std — fails only on a target that ships no std. isobmff-test-support
  # serves the tests alone, which run on a host, so it needs std.
  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --workspace --exclude isobmff-test-support --target thumbv7em-none-eabihf

  # Doctests run here, once: they are not instrumented in the coverage job
  # (that needs a nightly toolchain), and the code behaves the same on every host.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Mirror docs.rs, which builds with `--cfg docsrs`, so docsrs-gated doc
      # items are checked here too. Not for the doctests: docsrs may turn on
      # nightly-only attributes that a stable doctest build would refuse.
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings --cfg docsrs"
      - run: cargo test --doc --workspace --all-features
      # The alloc-free build has doctests of its own to pass, without the items alloc adds.
      - run: cargo test --doc -p isobmff-core --no-default-features

  # Framing and box codecs read against what GPAC reports for the files of
  # MPEG's FileFormatConformance, which are fetched at a pinned commit rather
  # than committed, and written against what FFmpeg's ffprobe reads back. The
  # tests that need them are ignored elsewhere.
  conformance:
    runs-on: ubuntu-latest
    steps:
      # Not apt's ffmpeg: it drags in every codec library from a mirror that
      # can stall for many minutes, and its version moves with the runner
      # image. FFmpeg-Builds keeps each month's last build, so this one stays
      # downloadable.
      - name: Install ffprobe
        timeout-minutes: 5
        run: |
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/ffmpeg.tar.xz" \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/ffmpeg-n8.1.3-9-g29e619e767-linux64-lgpl-8.1.tar.xz
          echo "dfa863a00ca81f1bdf58a372b18cff4820f0017e55de32778de8ecd8ed92a02e  $RUNNER_TEMP/ffmpeg.tar.xz" | sha256sum -c --quiet -
          tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP" --strip-components=2 --wildcards '*/bin/ffprobe'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: nextest
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The script pins the commit, so its hash keys the files it fetches.
      - id: files
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/conformance
          key: conformance-${{ hashFiles('scripts/fetch-conformance.sh') }}
      - if: steps.files.outputs.cache-hit != 'true'
        run: scripts/fetch-conformance.sh "$RUNNER_TEMP/conformance"
      - if: steps.files.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/conformance
          key: conformance-${{ hashFiles('scripts/fetch-conformance.sh') }}
      - run: ISOBMFF_CONFORMANCE_DIR="$RUNNER_TEMP/conformance" ISOBMFF_FFPROBE="$RUNNER_TEMP/ffprobe" cargo nextest run -p isobmff-core -p isobmff-boxes --run-ignored only

  # A fixed number of runs of each fuzz target, seeded with the conformance
  # files. A failure is a bug, so it blocks the merge. The nightly
  # is pinned so that a regression in it cannot block a change of ours; it is
  # raised by hand.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-10-13
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - id: files
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/conformance
          key: conformance-${{ hashFiles('scripts/fetch-conformance.sh') }}
      - if: steps.files.outputs.cache-hit != 'true'
        run: scripts/fetch-conformance.sh "$RUNNER_TEMP/conformance"
      # The seeds are the files alone: GPAC's reports beside them are not boxes.
      # The first directory takes what a run adds, and is never kept.
      - run: |
          mkdir -p "$RUNNER_TEMP/seeds" "$RUNNER_TEMP/corpus/framing" "$RUNNER_TEMP/corpus/boxes"
          cp "$RUNNER_TEMP"/conformance/*.mp4 "$RUNNER_TEMP/seeds/"
      # The target is spelled out: the cargo-fuzz this action installs is a
      # static musl binary, and defaults to the triple it was built for.
      - run: cargo fuzz run framing --target x86_64-unknown-linux-gnu "$RUNNER_TEMP/corpus/framing" "$RUNNER_TEMP/seeds" -- -runs=500000 -seed=1
      - run: cargo fuzz run boxes --target x86_64-unknown-linux-gnu "$RUNNER_TEMP/corpus/boxes" "$RUNNER_TEMP/seeds" -- -runs=500000 -seed=1

  # Advisories, license policy, banned crates and sources, per deny.toml.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny
      - run: cargo deny check
      # The fuzz targets are a workspace of their own, so the check above never
      # sees libfuzzer-sys or what it pulls in.
      - run: cargo deny --manifest-path fuzz/Cargo.toml check

  # The one check the main ruleset requires besides the PR title, so a job can
  # be added or renamed here without editing the ruleset. A skipped job passes:
  # `test` is skipped on pull requests by design.
  ci-success:
    if: always()
    needs: [lint, clippy, coverage, conformance, fuzz, test, msrv, no-std, docs, deny]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
