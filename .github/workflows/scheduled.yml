name: Scheduled

# Breakage that arrives without a change of ours: a new advisory against a
# dependency, or a regression in an upcoming toolchain. Weekly rather than per
# pull request, so a nightly regression does not block unrelated work. Also
# the inputs that only a longer fuzz run reaches than a pull request's.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny
      - run: cargo deny check advisories

  upcoming-toolchain:
    strategy:
      fail-fast: false
      matrix:
        toolchain: [beta, nightly]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      # No rust-cache: its key holds the rustc version, which beta and nightly
      # change between weekly runs, so a cache would be saved and never hit.
      - run: cargo test --workspace --all-features
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # Each fuzz target for longer than a pull request can wait, on the nightly
  # the `fuzz` job of ci.yml pins. A failing input is kept for a week as an
  # artifact of the run, to be shrunk into a unit test; it is never committed.
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        target: [framing, boxes, box_reader, demuxer]
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-10-13
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-fuzz
      - id: files
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/conformance
          key: conformance-${{ hashFiles('scripts/fetch-conformance.sh') }}
      - if: steps.files.outputs.cache-hit != 'true'
        run: scripts/fetch-conformance.sh "$RUNNER_TEMP/conformance"
      - run: |
          mkdir -p "$RUNNER_TEMP/seeds" "$RUNNER_TEMP/corpus"
          cp "$RUNNER_TEMP"/conformance/*.mp4 "$RUNNER_TEMP/seeds/"
      # One worker per core, with no sanitizer, as in ci.yml. A failure stops
      # the run, and its input lands in fuzz/artifacts.
      - run: cargo fuzz run "$TARGET" --target x86_64-unknown-linux-gnu --sanitizer none "$RUNNER_TEMP/corpus" "$RUNNER_TEMP/seeds" -- -fork="$(nproc)" -max_total_time=600
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          retention-days: 7
