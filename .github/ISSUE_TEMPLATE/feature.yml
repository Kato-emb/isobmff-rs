name: Feature request
description: A box, a codec, or a capability the library does not have
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you need
      description: What you are trying to do and what stops you today.
    validations:
      required: true
  - type: input
    id: specification
    attributes:
      label: Specification
      description: The specification and clause that define it, e.g. ISO/IEC 14496-12 §8.7.5.
