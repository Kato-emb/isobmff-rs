# Titles follow CONTRIBUTING.md "Pull request titles": `build(deps): ...` for
# Cargo, `ci(deps): ...` for workflow actions. Neither reaches the CHANGELOG.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo:
        patterns: ["*"]

  # The fuzz targets are a workspace of their own, with a lockfile of their own.
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      cargo:
        patterns: ["*"]

  # Actions are pinned by commit SHA; Dependabot moves the SHA and the version
  # comment beside it together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
