[package]
name = "isobmff-wasm"
version = "0.0.0"
description = "The isobmff crate as the browser reaches it, through wasm-bindgen"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
isobmff.workspace = true
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Blob", "FileReaderSync"] }

[dev-dependencies]
isobmff-test-support.workspace = true

# Why not `workspace = true`: that table cannot be overridden in part, and this
# crate is a consumer, which matches `non_exhaustive` enums with a `_` arm — so
# it is the workspace table copied without wildcard_enum_match_arm. Why each
# lint is on is stated there.
[lints.rust]
unsafe_code = "forbid"

missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unnameable_types = "warn"

trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"

cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"

float_arithmetic = "deny"

host_endian_bytes = "deny"
little_endian_bytes = "deny"

iter_over_hash_type = "deny"

dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

mod_module_files = "deny"
min_ident_chars = "deny"

allow_attributes_without_reason = "deny"

exhaustive_structs = "deny"
exhaustive_enums = "deny"

std_instead_of_core = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"

tests_outside_test_module = "warn"

missing_errors_doc = "warn"
missing_panics_doc = "warn"
too_long_first_doc_paragraph = "warn"
doc_markdown = "warn"
doc_link_with_quotes = "warn"

[lints.rustdoc]
unescaped_backticks = "warn"
