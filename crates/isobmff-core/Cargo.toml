[package]
name = "isobmff-core"
version = "0.0.0"
description = "Minimal, dependency-free layer for implementing ISO base media file format boxes"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["alloc"]
# Values that own their bytes on the heap, such as `Utf8String`.
alloc = []

[dev-dependencies]
# Reads the conformance files and GPAC's reports of them, which the framing is
# checked against, and runs ffprobe on what is written.
isobmff-test-support.workspace = true

# Containers need the heap their children are collected on.
[[test]]
name = "conformance"
required-features = ["alloc"]

[[test]]
name = "vendor_container"
required-features = ["alloc"]

[lints]
workspace = true
