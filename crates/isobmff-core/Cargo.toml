[package]
name = "isobmff-core"
version = "0.0.0"
description = "Minimal, dependency-free layer for implementing ISO base media file format boxes"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["alloc"]
# Values that own their bytes on the heap, such as `Utf8String`.
alloc = []

[dev-dependencies]
# Reads the box structure GPAC reports for a conformance file, which the
# framing is checked against.
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }

[lints]
workspace = true
