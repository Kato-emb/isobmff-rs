[package]
name = "isobmff"
version = "0.0.0"
description = "Sans-IO reader and writer for the samples an ISO base media file carries in movie fragments"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
readme.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
exclude.workspace = true

[features]
default = ["avc", "mp4"]
# The sample entries of ISO/IEC 14496-15, the carriage of AVC video.
avc = ["dep:isobmff-avc"]
# The sample entries and descriptors of ISO/IEC 14496-14, the MP4 file format.
mp4 = ["dep:isobmff-mp4"]

[dependencies]
isobmff-avc = { workspace = true, optional = true }
isobmff-boxes.workspace = true
isobmff-core.workspace = true
isobmff-mp4 = { workspace = true, optional = true }

[dev-dependencies]
isobmff-sequence.workspace = true
isobmff-test-support.workspace = true

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
