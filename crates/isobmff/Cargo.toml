[package]
name = "isobmff"
version = "0.0.0"
description = "Sans-IO reader and writer for a fragmented ISO base media file and the samples it carries"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
readme.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
exclude.workspace = true

[features]
default = ["avc", "mp4"]
# `isobmff::avc`, ISO/IEC 14496-15.
avc = ["dep:isobmff-avc"]
# `isobmff::mp4`, ISO/IEC 14496-14.
mp4 = ["dep:isobmff-mp4"]

[dependencies]
isobmff-avc = { workspace = true, optional = true }
isobmff-boxes.workspace = true
isobmff-core.workspace = true
isobmff-mp4 = { workspace = true, optional = true }
isobmff-sequence.workspace = true

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = [
    "cargo_bench_support",
] }
isobmff-test-support.workspace = true

[[bench]]
name = "throughput"
harness = false

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
