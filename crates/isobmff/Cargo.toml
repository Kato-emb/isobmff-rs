[package]
name = "isobmff"
version = "0.0.0"
description = "Sans-IO readers and writers for an ISO base media file and the samples it carries"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
readme.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
exclude.workspace = true

[features]
default = ["avc", "mp4"]
# `isobmff::avc`, ISO/IEC 14496-15.
avc = ["dep:isobmff-avc"]
# `isobmff::io`, the demuxers and the muxers driving the readers and writers.
io = ["dep:isobmff-io"]
# `isobmff::mp4`, ISO/IEC 14496-14.
mp4 = ["dep:isobmff-mp4"]

[dependencies]
isobmff-avc = { workspace = true, optional = true }
isobmff-boxes.workspace = true
isobmff-core.workspace = true
isobmff-io = { workspace = true, optional = true }
isobmff-mp4 = { workspace = true, optional = true }
isobmff-sample.workspace = true
isobmff-sequence.workspace = true
isobmff-structure.workspace = true

[dev-dependencies]
isobmff-test-support.workspace = true

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
