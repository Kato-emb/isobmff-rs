[package]
name = "isobmff"
version = "0.0.0"
description = "Sans-IO reading and writing of ISO base media files (ISO/IEC 14496-12)"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
isobmff-boxes.workspace = true
isobmff-core = { workspace = true, features = ["alloc"] }

[dev-dependencies]
# Pins the events of a file where no other implementation can judge them.
insta = { version = "1.43.2", default-features = false }
# Reads the conformance files, which the reading of boxes is checked against.
isobmff-test-support.workspace = true

[lints]
workspace = true
