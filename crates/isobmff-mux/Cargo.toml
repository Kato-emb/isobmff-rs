[package]
name = "isobmff-mux"
version = "0.0.0"
description = "Sans-IO demuxer, muxer and fast start of ISO base media files (ISO/IEC 14496-12), made of the layers of isobmff"
publish = false
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
isobmff.workspace = true
isobmff-boxes.workspace = true
isobmff-core = { workspace = true, features = ["alloc"] }

[features]
# Reads the compressed boxes, `!mov`, `!mof` and `!six` (§8.16), as the layers
# of isobmff read them under its feature of the same name.
compressed-boxes = ["isobmff/compressed-boxes"]

[dev-dependencies]
# Reads the conformance files, which the demuxer, the muxer and fast start are
# checked against.
isobmff-test-support.workspace = true
# Writes the compressed boxes the tests of the demuxer read (§8.16).
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }

[lints]
workspace = true
