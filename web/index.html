<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>isobmff-rs</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="bar">
        <span class="brand">isobmff-rs</span>
        <span id="chip" class="chip">no file</span>
        <nav id="tabs" class="tabs" aria-label="Views"></nav>
        <span class="note">Read in your browser, never uploaded</span>
        <button id="open" class="open-file" type="button">Open file…</button>
        <input
          id="file"
          type="file"
          hidden
          accept=".mp4,.m4v,.m4a,.m4s,.mov,.3gp,.3g2,.cmfv,.cmfa,.mp4a,video/mp4,audio/mp4"
        >
      </header>
      <div id="main" class="main">
        <section id="list" class="list" aria-live="polite"></section>
        <aside id="inspector" class="inspector" aria-label="Details"></aside>
      </div>
    </div>
  </body>
</html>
